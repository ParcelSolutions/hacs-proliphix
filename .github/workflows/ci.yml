name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check custom_components tests live_tests
      - run: ruff format --check custom_components tests live_tests

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: write
    steps:
      - uses: actions/checkout@v4
      - name: Set repository metadata for HACS
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo edit "${{ github.repository }}" \
            --description "Home Assistant integration for Proliphix Plus network thermostats" \
            --add-topic homeassistant \
            --add-topic hacs \
            --add-topic hacs-integration \
            --add-topic proliphix \
            --add-topic thermostat \
            --add-topic climate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate HACS structure from checkout
        run: python scripts/validate_hacs_structure.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements_test.txt
      - run: pytest tests -v
